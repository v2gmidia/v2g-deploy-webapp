<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>V2G — peça estática V3 — design local para revisão</title>
  <style>
    @font-face{font-family:Archivo;src:url("archivo-latin.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:block}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1080px;background:#051020;overflow:hidden}
    body{font-family:Archivo,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
    .arte{width:1080px;height:1080px;position:relative;padding:72px 80px 68px;background:#051020}
    .marca{display:flex;align-items:center;gap:22px;height:66px}
    .marca svg{width:62px;height:62px;flex:none;color:#e9fe64}
    .marca-nome{font-size:57px;line-height:1;font-weight:720;letter-spacing:-.04em}
    .marca-nome span{font-size:41px;font-weight:350;letter-spacing:-.035em;margin-left:12px}
    h1{margin:110px 0 0;font-size:102px;line-height:1.02;letter-spacing:-.035em;font-weight:750}
    h1 span{display:block}
    h1 .v2g{color:#e9fe64;margin-top:18px}
    .apoio{font-size:40px;line-height:1.25;font-weight:440;letter-spacing:-.015em;margin:45px 0 0}
    .apoio span{display:block}
    .chamada{position:absolute;left:80px;right:80px;bottom:68px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #536073;padding-top:29px;font-size:38px;line-height:1.2;font-weight:580;letter-spacing:-.015em}
    .chamada svg{width:52px;height:38px;color:#e9fe64;flex:none}
  </style>
</head>
<body>
<!-- THESIS: o dono cuida do negócio e uma operação humana cuida dos anúncios. OWN-WORLD: marca V2G, Archivo, marinho #051020 e lima #E9FE64, composição editorial limpa. STORY: reconhecer a divisão de responsabilidades e conversar no WhatsApp. FIRST VIEWPORT: marca no alto, quatro linhas grandes, apoio humano legível e chamada inferior. FORM: peça quadrada estática, direção nominal aprovada, design local determinístico; não gerada pelo agente V2G. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance. -->
<main class="arte" aria-label="Proposta de anúncio da V2G mídia">
  <header class="marca" aria-label="V2G mídia">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" aria-hidden="true"><g fill="currentColor"><rect x="10" y="0" width="30" height="10" rx="1.6"/><rect x="0" y="10" width="10" height="10" rx="1.6"/><rect x="40" y="10" width="10" height="10" rx="1.6"/><rect x="10" y="20" width="10" height="10" rx="1.6"/><rect x="30" y="20" width="10" height="10" rx="1.6"/><rect x="0" y="30" width="10" height="10" rx="1.6"/><rect x="40" y="30" width="10" height="10" rx="1.6"/><rect x="10" y="40" width="20" height="10" rx="1.6"/></g></svg>
    <div class="marca-nome">V2G<span>mídia</span></div>
  </header>
  <h1><span>Você cuida</span><span>do negócio.</span><span class="v2g">A V2G cuida</span><span style="color:#e9fe64">dos anúncios.</span></h1>
  <p class="apoio"><span>Gestão de anúncios com</span><span>acompanhamento humano.</span></p>
  <div class="chamada"><span>Converse com a V2G</span><svg viewBox="0 0 52 38" fill="none" stroke="currentColor" stroke-width="2.8" aria-hidden="true"><path d="M2 19h45M32 4l15 15-15 15"/></svg></div>
</main>
</body>
</html>
