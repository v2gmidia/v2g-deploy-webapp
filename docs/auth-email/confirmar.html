<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#f5f8f9;color:#111e2f;font-family:Arial,sans-serif">
  <main style="max-width:520px;margin:auto;background:#fff;border:1px solid #dce5e7;border-radius:16px;padding:32px">
    <p style="margin:0 0 32px;color:#0743dc;font-size:22px;font-weight:800;letter-spacing:-1px">V2G <span style="font-size:11px;letter-spacing:2px">MÍDIA</span></p>
    <h1 style="font-size:26px;line-height:1.2;margin:0 0 16px">Confirme seu e-mail</h1>
    <p style="font-size:16px;line-height:1.5">Confirme este endereço para continuar seu acesso à V2G.</p>
    <p style="margin:28px 0"><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;background:#0743dc;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:8px">Confirmar e-mail</a></p>
    <p style="font-size:13px;line-height:1.5;color:#52616c">Se você não criou esta conta, ignore esta mensagem. O link pode ser usado uma vez e expira conforme a configuração de segurança da conta.</p>
  </main>
</body>
</html>
